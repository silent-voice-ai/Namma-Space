<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAMMA SPACE — 3D Reconstruction Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main 3D Scene Viewport -->
  <div id="canvas-container"></div>

  <!-- Top-Left Branding HUD -->
  <div class="hud-panel top-left">
    <div class="brand-title">NAMMA SPACE</div>
    <div class="brand-sub">EDGE-NATIVE 3DGS ENGINE</div>
    <div class="stat-line">STATUS: <span id="sys-status">INITIALIZING...</span></div>
  </div>

  <!-- Bottom Control Overlay -->
  <div class="hud-panel bottom-center">
    <p>Drag to look | WASD to move | Scroll to zoom</p>
  </div>

  <!-- Top-Right Minimap Container -->
  <div class="hud-panel top-right">
    <div class="minimap-header">PLAN / TOP DOWN</div>
    <div id="minimap-viewport"></div>
  </div>

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
      }
    }
  </script>

  <!-- Main Application Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
